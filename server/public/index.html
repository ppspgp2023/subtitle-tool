<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>字幕生成服务</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎬 字幕生成服务</h1>
    <button id="logoutBtn" class="ghost">退出登录</button>
  </header>

  <main>
    <!-- 上传与选项 -->
    <section class="panel">
      <h2>上传视频</h2>
      <div class="row">
        <input type="file" id="fileInput" accept="video/*,audio/*" />
      </div>
      <div class="options">
        <label>
          字幕类型
          <select id="subtitleType">
            <option value="bilingual">双语（原文 + 中文）</option>
            <option value="chinese">纯中文</option>
          </select>
        </label>
        <label>
          视频语言
          <select id="sourceLang">
            <option value="auto">自动识别</option>
            <option value="ja">日语</option>
            <option value="en">英语</option>
            <option value="ko">韩语</option>
            <option value="zh">中文</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="es">西班牙语</option>
            <option value="ru">俄语</option>
          </select>
        </label>
        <label>
          时间段（可选）
          <input type="text" id="ranges" placeholder="如 0-10:00; 20:00-30:00，留空处理整段" />
        </label>
      </div>
      <div class="row">
        <button id="uploadBtn">上传并生成字幕</button>
        <div class="progress-wrap" id="uploadProgressWrap" hidden>
          <div class="progress-bar"><div class="progress-fill" id="uploadFill"></div></div>
          <span id="uploadPct">0%</span>
        </div>
      </div>
      <p class="hint" id="uploadHint"></p>
    </section>

    <!-- 实时进度 -->
    <section class="panel" id="jobPanel" hidden>
      <h2>处理进度 <span class="badge" id="jobBadge">等待中</span></h2>
      <pre class="logbox" id="logbox"></pre>
    </section>

    <!-- 文件列表 -->
    <section class="panel">
      <div class="row between">
        <h2>我的文件</h2>
        <button id="refreshBtn" class="ghost">刷新</button>
      </div>
      <table class="filetable">
        <thead>
          <tr>
            <th>文件名</th>
            <th>大小</th>
            <th>上传时间</th>
            <th>到期时间</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="fileBody">
          <tr><td colspan="6" class="empty">加载中…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
