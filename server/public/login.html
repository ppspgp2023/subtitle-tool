<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 字幕生成服务</title>
  <!-- 样式内联：登录页在鉴权之前，无法加载受保护的 style.css -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #e2e8f0;
    }
    .card {
      width: 340px;
      max-width: 90vw;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }
    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    p.sub { margin: 0 0 24px; text-align: center; color: #94a3b8; font-size: 13px; }
    label { display: block; font-size: 13px; margin: 14px 0 6px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0ea5e9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .err { margin-top: 14px; color: #f87171; font-size: 13px; text-align: center; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>字幕生成服务</h1>
    <p class="sub">请登录后使用</p>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="submitBtn">登录</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = '登录中…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || '登录失败';
      } catch (_) {
        err.textContent = '网络错误，请重试';
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
